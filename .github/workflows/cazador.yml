name: Cazador de Chambas

on:
  schedule:
    # Se ejecuta en el minuto 0 cada 4 horas. (Horario UTC)
    - cron: '0 */4 * * *'
  # Botón manual para probar el bot desde la pestaña Actions.
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Damos permiso explícito al bot para guardar (push) archivos en el repositorio.
    permissions:
      contents: write

    steps:
      - name: Bajar mi código
        # Checkout con el token de GitHub para que el push posterior esté autenticado.
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chrome y ChromeDriver
        run: |
          # GitHub Actions usa Ubuntu. Instalamos Chrome headless de forma estable.
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable

      - name: Ejecutar el buscador de empleos (Cazador)
        # Aquí pasamos los secretos que debes crear en Settings > Secrets de este repo en GitHub
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Guardar memoria en GitHub (Self-Commit)
        # Esto hace Add de los archivos JSON si sufrieron alguna modificación,
        # crea un Commit y hace Push para actualizar el repo y conservar la memoria de cara al próximo ciclo.
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          # Usamos -f para forzar el add aunque .gitignore los liste (por si acaso).
          git add -f seen_jobs.json last_update.json keywords.json || true

          # Si no hubo cambios en los JSON, el commit falla silenciosamente sin frenar el workflow.
          git commit -m "🤖 Memoria Actualizada: Se guardó el progreso de Cazador." || echo "No hubo cambios para guardar."

          # Push autenticado con el GITHUB_TOKEN generado automáticamente por GitHub Actions.
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
